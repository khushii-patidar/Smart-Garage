{% extends "base.html" %}
{% block title %}Emergency SOS | Smart Garage{% endblock %}

{% block extra_css %}
<!-- Leaflet CSS for Free Maps -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
<style>
body { font-family: 'Poppins', sans-serif; background: #070c18; color: #fff; }
.sos-container { max-width: 900px; margin: 40px auto; padding: 20px; text-align: center; }
.sos-container h1 { font-size: 36px; font-weight: 900; color: #ef4444; margin-bottom: 10px; }
.sos-container p { color: rgba(255,255,255,0.7); font-size: 16px; margin-bottom: 30px; }

#map { height: 600px; width: 100%; border-radius: 20px; border: 4px solid #ef4444; box-shadow: 0 10px 30px rgba(239, 68, 68, 0.3); margin-bottom: 30px; background: #1b1e26; z-index: 1; }

.btn-sos { background: #ef4444; color: #fff; padding: 18px 40px; border-radius: 99px; font-weight: 900; font-size: 20px; border: none; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(239, 68, 68, 0.4); animation: pulse 2s infinite; position: relative; z-index: 2; }
.btn-sos:hover { background: #dc2626; transform: scale(1.05); }

@keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
    70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
    100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
}

body.light-mode { background: #f4f4f5; color: #111; }
body.light-mode p { color: #555; }
</style>
{% endblock %}

{% block content %}
<div class="sos-container">
    <h1 style="margin-bottom: 30px;">📍 Find Garage</h1>

    <!-- Free Map Container -->
    <div id="map"></div>

    <button class="btn-sos" id="sosBtn" onclick="requestTowTruck()">
        📍 Locate Me & Send Help
    </button>
</div>

<!-- Leaflet JS & Geocoder JS for Search Bar -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

<script>
    // Initialize Free Map
    var map = L.map('map').setView([20.5937, 78.9629], 5);

    // Use Esri World Street Map (100% Free, No Watermark, No API Key)
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri'
    }).addTo(map);

    // Add Search Bar (Geocoder) to Map
    var geocoder = L.Control.geocoder({
        defaultMarkGeocode: false,
        placeholder: "Search nearest garage or city..."
    })
    .on('markgeocode', function(e) {
        var bbox = e.geocode.bbox;
        var center = e.geocode.center;
        
        // Zoom map to searched location
        map.fitBounds(bbox);
        
        // Add a blue marker for searched location
        L.marker(center).addTo(map)
            .bindPopup("<b>Searched Location:</b><br>" + e.geocode.name)
            .openPopup();
    })
    .addTo(map);

    var marker;

    function requestTowTruck() {
        const btn = document.getElementById("sosBtn");
        btn.innerHTML = "⏳ Finding Location...";

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    // Zoom into user's live location
                    map.setView([lat, lng], 16);
                    
                    // Add a Red Marker
                    if (marker) { map.removeLayer(marker); }
                    
                    // Custom red icon
                    var redIcon = L.icon({
                        iconUrl: 'https://cdn.rawgit.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
                        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                        iconSize: [25, 41],
                        iconAnchor: [12, 41],
                        popupAnchor: [1, -34],
                        shadowSize: [41, 41]
                    });

                    marker = L.marker([lat, lng], {icon: redIcon}).addTo(map)
                        .bindPopup("<b>You are here!</b><br>Help is arriving.")
                        .openPopup();

                    btn.innerHTML = "✅ Tow Truck Dispatched!";
                    btn.style.background = "#10b981"; // Green
                    btn.style.animation = "none";
                    
                    setTimeout(() => {
                        alert("Emergency Alert sent to Admin! A Tow truck is on its way to your live location.");
                    }, 500);
                },
                (error) => {
                    alert("Error: Please allow Location (GPS) permissions in your browser.");
                    btn.innerHTML = "📍 Locate Me & Send Help";
                }
            );
        } else {
            alert("Error: Your browser doesn't support geolocation.");
        }
    }
</script>
{% endblock %}
